name: QA
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.21

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55

  test:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.21

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make test
        env:
          WETSOCKS_TEST_MIN_COV: ${{ vars.MIN_COVERAGE }}
